# 前端容器内 nginx 配置：静态资源 + SPA 回退 + 反向代理到管理后端
# 生产构建时前端请求仍写成 /api/**、/storage/**，由这里转发，因此浏览器端无需任何地址配置
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart.max-request-size（5120MB）保持一致，
    # 否则大数据集 zip 导入会在 nginx 层先被 413 拒掉
    client_max_body_size 5120m;

    # Vue Router history 模式：未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 管理后端（compose 中的服务名 manager）
    location /api/ {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/导入进度轮询不要超时中断
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    # 本地存储模式下的静态图片直链（yolo.storage.type=local 时才会用到）
    location /storage/ {
        proxy_pass http://manager:8080;
        proxy_set_header Host $host;
        expires 1d;
    }

    # 在线接口文档（可选，不需要对外暴露时删掉这两段）
    location /swagger-ui/ {
        proxy_pass http://manager:8080;
        proxy_set_header Host $host;
    }

    location = /v3/api-docs {
        proxy_pass http://manager:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
